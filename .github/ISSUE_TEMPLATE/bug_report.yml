name: Bug report
description: Something behaves differently from what the docs or the types promise.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        One request before you start: **if this is a security problem, close this form.**
        Use the private reporting link in [SECURITY.md](https://github.com/usetheokit/.github/blob/main/SECURITY.md)
        instead, so a fix can ship before the details are public.

  - type: dropdown
    id: area
    attributes:
      label: Which part misbehaves
      description: Pick the package the failing call belongs to. If it spans several, pick where it surfaced.
      options:
        - "theokit — web framework"
        - "@theokit/sdk — agent runtime"
        - "@theokit/ui — React components"
        - "@theokit/tui — terminal components"
        - "@theokit/gateway-* — messaging channels"
        - "@theokit/plugin-* / @theokit/auth-*"
        - "@theokit/di / @theokit/orm"
        - "@theokit/skill — Claude Code plugin"
        - "Not sure / more than one"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package version
      description: "The resolved number from `npm ls <package>` or your lockfile — not `latest`."
      placeholder: "@theokit/sdk 4.53.1"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Node version and OS
      description: "`node -v` plus your platform. This stack spawns processes and touches the filesystem, so both matter."
      placeholder: "v22.12.0, Ubuntu 24.04 (x64)"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: >
        What you expected, and what you got instead. Lead with the impact — a run that
        hangs, a route that 404s, a component that renders blank, a type that will not
        compile.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: >
        Numbered steps, or the smallest snippet that fails. A failing test is ideal.
        If you could only trigger it once, say so — an intermittent report is still
        worth filing, it just gets triaged differently.
      placeholder: |
        1. npx create-theokit repro && cd repro
        2. Paste agents/chat.ts below
        3. pnpm dev, POST /api/agents/chat
        4. The stream ends after the first token
      render: markdown
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: >
        Whatever you have: the error and its stack, console output, the failing request
        as `METHOD URL -> status`, a screenshot. **Never paste a real API key** — if one
        leaked, rotate it first, then report the code path that leaked it.
      render: shell

  - type: textarea
    id: suspicion
    attributes:
      label: Where you think it comes from
      description: >
        Optional, and an honest "no idea" is fine. If you already found the file, the
        commit or the layer, it usually saves a day of triage.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the open issues in this repository and this is not a duplicate.
          required: true
        - label: There is no credential, token or cookie anywhere in this report.
          required: true
